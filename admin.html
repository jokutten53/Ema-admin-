<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ema Shop - Admin Dashboard</title>
    <style>
        :root { --primary: #ff4757; --bg: #f1f2f6; --text: #2f3542; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; background: var(--bg); color: var(--text); }
        
        #loginScreen { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-box { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 320px; text-align: center; }
        .login-box h2 { color: var(--primary); margin-top: 0; }
        .login-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #dfe4ea; box-sizing: border-box; }
        .login-box button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        
        #dashboardScreen { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        header { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { margin: 0; font-size: 1.5rem; color: var(--primary); }

        .dashboard-grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; }
        @media (max-width: 900px) { .dashboard-grid { grid-template-columns: 1fr; } }

        /* Panels */
        .panel { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .panel h3 { margin-top: 0; border-bottom: 2px solid var(--bg); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #dfe4ea; border-radius: 6px; box-sizing: border-box; }
        .image-preview { width: 100%; height: 150px; background: #f8f9fa; border: 2px dashed #ced6e0; border-radius: 8px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; overflow: hidden; position: relative; cursor: pointer;}
        .image-preview img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .btn-upload { width: 100%; padding: 12px; background: #2ed573; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* Orders Styles */
        .order-card { border: 1px solid #dfe4ea; border-left: 5px solid var(--primary); border-radius: 8px; padding: 15px; margin-bottom: 15px; background: #fafafa; }
        .order-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .order-details p { margin: 5px 0; font-size: 0.95rem; }
        .order-items { background: #fff; padding: 10px; border-radius: 6px; border: 1px solid #eee; margin: 10px 0; font-size: 0.9rem; color: #555; }
        .btn-complete { background: #2ed573; color: white; border: none; padding: 8px 15px; border-radius: 4px; font-weight: bold; cursor: pointer; float: right; }

        /* Product Inventory Styles */
        #productList { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
        .product-card { border: 1px solid #dfe4ea; border-radius: 8px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 120px; object-fit: cover; }
        .product-info { padding: 10px; }
        .btn-delete { position: absolute; top: 5px; right: 5px; background: var(--primary); color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>

    <div id="loginScreen">
        <div class="login-box">
            <h2>Ema Beauty Parlour</h2>
            <p style="color: #747d8c; font-size: 0.9rem;">Admin Control Panel</p>
            <input type="password" id="adminPass" placeholder="Admin Password">
            <button onclick="login()">Enter Dashboard</button>
            <p id="errorMsg" style="color: #ff4757; display: none; font-size: 0.85rem;">Incorrect Password!</p>
        </div>
    </div>

    <div id="dashboardScreen">
        <header>
            <h1>Ema Shop - Admin</h1>
            <button onclick="logout()" style="padding: 8px 15px; border-radius:6px; border:none; cursor:pointer;">Log Out</button>
        </header>

        <div class="dashboard-grid">
            <!-- Upload Form -->
            <div class="panel">
                <h3>+ Add New Product</h3>
                <div class="image-preview" onclick="document.getElementById('fileInput').click()">
                    <span id="previewText">Click to upload photo</span>
                    <img id="imagePreviewImg" src="">
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display: none;">
                <div class="form-group"><label>Product Name</label><input type="text" id="prodName" placeholder="Item name..."></div>
                <div class="form-group"><label>Price (₹)</label><input type="number" id="prodPrice" placeholder="e.g., 500"></div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="prodCategory"><option>Garments</option><option>Tailoring</option><option>Beauty</option></select>
                </div>
                <button class="btn-upload" onclick="uploadProduct()">Save to Store</button>
            </div>

            <!-- Orders and Inventory Column -->
            <div>
                <!-- Orders Section -->
                <div class="panel">
                    <h3>🛒 Incoming Orders</h3>
                    <div id="ordersList">
                        <p style="color: #747d8c;">Waiting for new orders...</p>
                    </div>
                </div>

                <!-- Inventory Section -->
                <div class="panel">
                    <h3>📦 Live Inventory</h3>
                    <div id="productList"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getDatabase, ref, push, onChildAdded, onChildRemoved, remove } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAVKJVGHmoV_h1frjD5AASa_H9BglnVwmw",
            authDomain: "familydictionary6253.firebaseapp.com",
            databaseURL: "https://familydictionary6253-default-rtdb.firebaseio.com",
            projectId: "familydictionary6253",
            storageBucket: "familydictionary6253.firebasestorage.app"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const shopDbRef = ref(db, 'ema_shop/products');
        const ordersDbRef = ref(db, 'ema_shop/orders');

        let base64Image = null;

        window.login = () => {
            if (document.getElementById('adminPass').value === 'ema123') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('dashboardScreen').style.display = 'block';
                loadInventory(); loadOrders();
            } else { document.getElementById('errorMsg').style.display = 'block'; }
        };

        window.logout = () => { location.reload(); };

        // Handle Image
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const MAX_SIZE = 600; let width = img.width; let height = img.height;
                    if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } 
                    else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    base64Image = canvas.toDataURL('image/jpeg', 0.7);
                    document.getElementById('imagePreviewImg').src = base64Image;
                    document.getElementById('imagePreviewImg').style.display = 'block';
                    document.getElementById('previewText').style.display = 'none';
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        // Add Product
        window.uploadProduct = async () => {
            const name = document.getElementById('prodName').value.trim();
            const price = document.getElementById('prodPrice').value.trim();
            if (!name || !price || !base64Image) return alert("Fill all fields and upload an image!");
            
            await push(shopDbRef, { name, price, category: document.getElementById('prodCategory').value, image: base64Image, timestamp: Date.now() });
            
            document.getElementById('prodName').value = ""; document.getElementById('prodPrice').value = ""; base64Image = null;
            document.getElementById('imagePreviewImg').style.display = 'none'; document.getElementById('previewText').style.display = 'block';
            alert("Product added!");
        };

        // Load Products
        let inventoryLoaded = false;
        function loadInventory() {
            if (inventoryLoaded) return; inventoryLoaded = true;
            onChildAdded(shopDbRef, (snapshot) => {
                const p = snapshot.val(); const key = snapshot.key;
                const card = document.createElement('div'); card.className = "product-card"; card.id = `prod-${key}`;
                card.innerHTML = `<button class="btn-delete" onclick="deleteProduct('${key}')">X</button><img src="${p.image}"><div class="product-info"><div style="font-weight:bold;">${p.name}</div><div style="color:#2ed573;">₹${p.price}</div></div>`;
                document.getElementById('productList').prepend(card);
            });
            onChildRemoved(shopDbRef, (snapshot) => {
                const el = document.getElementById(`prod-${snapshot.key}`); if (el) el.remove();
            });
        }

        window.deleteProduct = async (key) => { if(confirm("Remove product?")) await remove(ref(db, `ema_shop/products/${key}`)); };

        // Load Orders
        let ordersLoaded = false;
        function loadOrders() {
            if (ordersLoaded) return; ordersLoaded = true;
            const ordersList = document.getElementById('ordersList');
            
            onChildAdded(ordersDbRef, (snapshot) => {
                if(ordersList.innerHTML.includes("Waiting for new orders")) ordersList.innerHTML = '';
                
                const order = snapshot.val(); const key = snapshot.key;
                const orderCard = document.createElement('div'); orderCard.className = "order-card"; orderCard.id = `order-${key}`;
                
                orderCard.innerHTML = `
                    <div class="order-header">
                        <span>ID: ${order.orderId}</span>
                        <span style="color: #ff4757;">₹${order.totalAmount} (${order.paymentMethod})</span>
                    </div>
                    <div class="order-details">
                        <p><strong>Customer:</strong> ${order.customerName}</p>
                        <p><strong>Phone:</strong> ${order.customerPhone}</p>
                        <p><strong>Address:</strong> ${order.customerAddress}</p>
                        <div class="order-items"><strong>Items:</strong> ${order.items}</div>
                        <p style="font-size: 0.8rem; color: #aaa;">Date: ${order.date}</p>
                    </div>
                    <button class="btn-complete" onclick="completeOrder('${key}')">Mark as Delivered</button>
                    <div style="clear:both;"></div>
                `;
                ordersList.prepend(orderCard); // Show newest orders at the top
            });

            onChildRemoved(ordersDbRef, (snapshot) => {
                const el = document.getElementById(`order-${snapshot.key}`); if (el) el.remove();
                if(ordersList.children.length === 0) ordersList.innerHTML = '<p style="color: #747d8c;">Waiting for new orders...</p>';
            });
        }

        // Complete Order (Deletes it from active list)
        window.completeOrder = async (key) => {
            if(confirm("Mark this order as delivered and clear it from the dashboard?")) {
                await remove(ref(db, `ema_shop/orders/${key}`));
            }
        };

    </script>
</body>
</html>
